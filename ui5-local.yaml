# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: project1
type: application
framework:
  name: SAPUI5
  version: 1.120.14
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        backend:
          - path: /sap
            url: http://mgss81a.aws.msg.de:44300
            destination: T30onPrem
          - path: /sap/opu/odata/sap/ZRI_SB_RIP_DATA/
            url: http://mgss81a.aws.msg.de:44300
            client: '800'
            destination: T30onPrem
          - path: /sap/opu/odata/sap/ZGS_SRT_SRV/
            url: http://mgss81a.aws.msg.de:44300
            client: '800'
            destination: T30onPrem
          - path: /sap/opu/odata/sap/ZRI_S_BUSINESS_PARTNER/
            url: http://mgss81a.aws.msg.de:44300
            client: '800'
            destination: T30onPrem
          - path: /sap/opu/odata/sap/ZRI_S_TTY_DATA/
            url: http://mgss81a.aws.msg.de:44300
            client: '800'
            destination: T30onPrem
          - path: /sap/opu/odata/sap/ZRI_SB_ACC_DATA/
            url: http://mgss81a.aws.msg.de:44300
            client: '800'
            destination: T30onPrem
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZRI_SB_DATA
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZRI_SB_RIP_DATA
            metadataPath: ./webapp/localService/ZRI_SB_RIP_DATA/metadata.xml
            mockdataPath: ./webapp/localService/ZRI_SB_RIP_DATA/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZGS_SRT_SRV
            metadataPath: ./webapp/localService/ZGS_SRT_SRV/metadata.xml
            mockdataPath: ./webapp/localService/ZGS_SRT_SRV/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZRI_S_BUSINESS_PARTNER
            metadataPath: ./webapp/localService/ZRI_S_BUSINESS_PARTNER/metadata.xml
            mockdataPath: ./webapp/localService/ZRI_S_BUSINESS_PARTNER/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZRI_S_TTY_DATA
            metadataPath: ./webapp/localService/ZRI_S_TTY_DATA/metadata.xml
            mockdataPath: ./webapp/localService/ZRI_S_TTY_DATA/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZRI_SB_ACC_DATA
            metadataPath: ./webapp/localService/ZRI_SB_ACC_DATA/metadata.xml
            mockdataPath: ./webapp/localService/ZRI_SB_ACC_DATA/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/mainService/ZRI_SB_DATA_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZRI_SB_DATA_VAN',Version='0001')/$value/
          - localPath: ./webapp/localService/ZRI_SB_RIP_DATA/ZRI_SB_RIP_DATA_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZRI_SB_RIP_DATA_VAN',Version='0001')/$value/
          - localPath: ./webapp/localService/ZRI_S_BUSINESS_PARTNER/ZRI_S_BUSINESS_PARTNER_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZRI_S_BUSINESS_PARTNER_VAN',Version='0001')/$value/
          - localPath: ./webapp/localService/ZRI_S_TTY_DATA/ZRI_S_TTY_DATA_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZRI_S_TTY_DATA_VAN',Version='0001')/$value/
          - localPath: ./webapp/localService/ZRI_SB_ACC_DATA/ZRI_SB_ACC_DATA_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZRI_SB_ACC_DATA_VAN',Version='0001')/$value/
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
